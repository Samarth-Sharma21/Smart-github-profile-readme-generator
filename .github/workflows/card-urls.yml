name: Check card URLs

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - lib/stats-cards.mjs
      - scripts/check-card-urls.mjs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Card URLs and workflow inputs
        run: node scripts/check-card-urls.mjs octocat
      - name: Generated workflow is valid YAML
        run: |
          node --input-type=module -e "import { cardsWorkflowYaml } from './lib/stats-cards.mjs'; process.stdout.write(cardsWorkflowYaml({ stats: true, topLangs: true }))" > /tmp/readme-cards.yml
          ruby -ryaml -e 'YAML.safe_load(File.read("/tmp/readme-cards.yml"))'
